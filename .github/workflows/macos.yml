name: MacOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: macos-12

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.0
      
    - name: Create default profile
      run: conan profile detect

      
    - name: Install dependencies
      run: conan install . -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

    - name: Configure CMake
      run: cmake --preset conan-debug -DENABLE_TEST_COVERAGE=1 -DUNLEASH_ENABLE_TESTING=ON

    - name: Build
      run: cmake --build --preset conan-debug

    - name: Test
      working-directory: ${{github.workspace}}/build/Debug/test
      run: ./tests


      
