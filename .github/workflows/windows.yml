name: Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.0
      
    - name: Create default profile
      run: conan profile detect

    - name: Install dependencies
      run: conan install . -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

    - name: Configure CMake
      run: cmake --preset conan-default -DUNLEASH_ENABLE_TESTING=ON

    - name: Build
      run: cmake --build --preset conan-release -j10

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure
