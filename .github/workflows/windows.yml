name: Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.0
      
    - name: Create default profile
      run: conan profile detect

    - name: Install dependencies
      run: conan install . -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

    - name: Configure CMake
      run: cmake --preset conan-default -DUNLEASH_ENABLE_TESTING=ON

    - name: Build
      run: cmake --build --preset conan-release -j10

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C Release --output-on-failure

    # A DLL is linked at build time, so this catches missing system-library
    # links (e.g. ws2_32 for inet_pton) that a static build would not.
    - name: Build shared library
      run: |
        cmake --preset conan-default -DUNLEASH_ENABLE_TESTING=OFF -Dunleash_SHARED_LIBS=ON
        cmake --build --preset conan-release --target unleash -j10

  # windows-latest ships a very recent MSVC that provides std::regex_constants::multiline.
  # Older MSVC toolchains (_MSC_VER < 1950) do not, so this job pins the 14.44 toolset
  # (_MSC_VER 1944) to guarantee the library still compiles there (the (?m) flag is
  # ignored at that version). Compiling the static library exercises every source file.
  old-msvc:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MSVC v14.44 toolset (_MSC_VER 1944, below 19.50)
      shell: pwsh
      run: |
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
        $vs = & "$installer\vswhere.exe" -latest -property installationPath
        $p = Start-Process -FilePath "$installer\setup.exe" -Wait -PassThru -ArgumentList `
          "modify","--installPath","$vs","--quiet","--norestart","--add","Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64"
        if ($p.ExitCode -ne 0) { throw "VS modify exited with $($p.ExitCode)" }
        Write-Host "VS install path: $vs"
        Write-Host "Installed MSVC toolsets:"
        Get-ChildItem "$vs\VC\Tools\MSVC" -Name
        # Share the resolved VS path with the build step (runner edition/path is not fixed).
        "VSPATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.0

    - name: Build the library with the v14.44 toolset
      run: |
        call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.44 || exit /b 1
        cl 2>&1 | findstr /C:"Version"
        conan profile detect --force
        conan install . -s build_type=%BUILD_TYPE% -s compiler.cppstd=17 -s compiler.version=194 -c tools.cmake.cmaketoolchain:generator=Ninja --build=missing || exit /b 1
        cmake --preset conan-release -DUNLEASH_ENABLE_TESTING=OFF || exit /b 1
        cmake --build --preset conan-release --target unleash || exit /b 1
