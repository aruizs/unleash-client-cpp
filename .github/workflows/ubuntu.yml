name: Ubuntu

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Debug  
  SONAR_SCANNER_VERSION: 6.0.0.4432
  SONAR_SERVER_URL: "https://sonarcloud.io"
  BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.0
      
    - name: Create default profile
      run: conan profile detect
    
    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
    
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
        
    - name: Download and set up sonar-scanner
      env:
        SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-linux.zip
      run: |
        mkdir -p $HOME/.sonar
        curl -sSLo $HOME/.sonar/sonar-scanner.zip ${{ env.SONAR_SCANNER_DOWNLOAD_URL }} 
        unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
        echo "$HOME/.sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-linux/bin" >> $GITHUB_PATH
    
    - name: Download and set up build-wrapper
      env:
        BUILD_WRAPPER_DOWNLOAD_URL: ${{ env.SONAR_SERVER_URL }}/static/cpp/build-wrapper-linux-x86.zip
      run: |
        curl -sSLo $HOME/.sonar/build-wrapper-linux-x86.zip ${{ env.BUILD_WRAPPER_DOWNLOAD_URL }}
        unzip -o $HOME/.sonar/build-wrapper-linux-x86.zip -d $HOME/.sonar/
        echo "$HOME/.sonar/build-wrapper-linux-x86" >> $GITHUB_PATH

    - name: Install dependencies
      run: conan install . -s build_type=${{env.BUILD_TYPE}} -s compiler.cppstd=17 --build=missing

    - name: Configure CMake
      run: cmake --preset conan-debug -DENABLE_TEST_COVERAGE=1 -G Ninja -DUNLEASH_ENABLE_TESTING=ON

    - name: Build with sonar wrapper
      run: build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build --preset conan-debug -j10

    - name: Test
      working-directory: ${{github.workspace}}/build/Debug/test
      run: ./tests

    - name: Coverage
      run: find . -name '*.gcda' | xargs gcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
    
    - name: Run sonar-scanner
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        sonar-scanner --define sonar.host.url="${{ env.SONAR_SERVER_URL }}" --define sonar.cfamily.compile-commands="${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json" --define sonar.cfamily.gcov.reportsPath="${{github.workspace}}"

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Get Conan
      uses: turtlebrowser/get-conan@v1.0

    - name: Create default profile
      run: conan profile detect

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master

    # ThreadSanitizer aborts with "unexpected memory mapping" on the runner's
    # default ASLR entropy; lowering it is the documented workaround. Harmless
    # for the other sanitizers. Needed before the build because GoogleTest runs
    # the test binary at build time to discover test cases.
    - name: Reduce ASLR entropy for sanitizers
      run: sudo sysctl -w vm.mmap_rnd_bits=28

    - name: Install dependencies
      run: conan install . -s build_type=Debug -s compiler.cppstd=17 --build=missing

    - name: Configure CMake
      run: cmake --preset conan-debug -G Ninja -DUNLEASH_ENABLE_TESTING=ON -DUNLEASH_BUILD_EXAMPLES=ON -DUNLEASH_SANITIZER=${{ matrix.sanitizer }}

    - name: Build
      run: cmake --build --preset conan-debug -j10

    - name: Test
      working-directory: ${{github.workspace}}/build/Debug/test
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1
      run: ./tests

    
  
